<style>
/* Layout: one centred column. A big master dial up top, a grid of smaller brass-bezel dials below it,
   then the card-bill breakdown. Bright optimistic colour on cream; brass rims, tick marks and rivets. */
:root{
  --bg:#EDF9F7; --panel:#FFFFFF; --panel2:#DBF2EE; --ink:#16404D; --muted:#547880;
  --line:#C3E5E0; --track:#DDF0ED; --brass:#2BB5A8; --brass-hi:#9FE0D8; --brass-ink:#0E6F68;
  --sky:#4AA8E0; --sun:#FFD95A; --cherry:#D94B40; --teal:#A7EBD9; --on-accent:#FFFFFF;
  --display:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --num:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E2A30; --panel:#153A42; --panel2:#1C4A54; --ink:#EAF9F6; --muted:#A3C7C8;
  --line:#2A5964; --track:#24505A; --brass:#4FD1C5; --brass-hi:#3F8F96; --brass-ink:#A5EDE5;
  --sky:#63B8EE; --sun:#FFD95A; --cherry:#FF8274; --teal:#7FE0C3; --on-accent:#0E2A30; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E2A30; --panel:#153A42; --panel2:#1C4A54; --ink:#EAF9F6; --muted:#A3C7C8;
  --line:#2A5964; --track:#24505A; --brass:#4FD1C5; --brass-hi:#3F8F96; --brass-ink:#A5EDE5;
  --sky:#63B8EE; --sun:#FFD95A; --cherry:#FF8274; --teal:#7FE0C3; --on-accent:#0E2A30; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
#app{display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13.5px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.cog{width:52px;height:52px;flex:none}
.robbie{display:flex;align-items:flex-end;gap:10px}
.robbie svg{width:72px;height:72px;flex:none}
.bubble{background:var(--panel);border:3px solid var(--brass-hi);border-radius:22px 22px 22px 6px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;min-width:0;margin-bottom:10px}
.bubble .who{font-family:var(--display);font-weight:700;color:var(--brass-ink)}
.rb-eyes{transform-box:fill-box;transform-origin:center;animation:rb-blink 6s infinite}
@keyframes rb-blink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){ .rb-eyes{animation:none} }
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--teal)}
.dot.local{background:var(--sun)} .dot.wait{background:var(--line)}

button,select,input{font:inherit;color:inherit}
.btn{border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:9px 18px;font-weight:800;cursor:pointer;min-height:44px}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--ink);opacity:.88}
.btn.sun{background:var(--sun);color:#16404D;border-color:#16404D}
.btn.quiet{border-color:var(--line);font-weight:700}
.btn.sm{padding:6px 13px;min-height:38px;font-size:14px}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
select,input[type=text],input[type=number],input[type=date]{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-height:42px;max-width:100%}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.spread{justify-content:space-between}

.stepper{display:flex;align-items:center;gap:6px}
.stepper .lbl{font-family:var(--display);font-size:19px;min-width:9.5ch;text-align:center}
.stepper button{width:42px;height:42px;border-radius:50%;border:2px solid var(--brass);background:var(--panel);color:var(--brass-ink);font-size:20px;font-weight:800;cursor:pointer;line-height:1}
.stepper button:hover{background:var(--panel2)}

.plate{background:var(--panel);border:3px solid var(--brass-hi);border-radius:28px;padding:20px;position:relative}
.plate.riv::before,.plate.riv::after{content:none}
.plate.riv::before{left:10px} .plate.riv::after{right:10px}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.hero .dialbox{width:190px;max-width:100%;flex:none;margin-inline:auto}
.hero .info{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:10px}
.big{font-family:var(--num);font-weight:700;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}

.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;font-weight:800;cursor:pointer;min-height:40px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

.dials{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.dial{background:var(--panel);border:3px solid var(--line);border-radius:28px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;min-width:0}
.dial:hover{border-color:var(--brass)}
.dial svg{width:118px;max-width:100%;height:auto}
.dial .nm{font-weight:800;overflow-wrap:anywhere}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:800;background:var(--panel2);color:var(--ink)}
.pill.over{background:var(--cherry);color:var(--on-accent)}
.pill.ok{background:var(--teal);color:#0E3B22}
.city{display:block;width:100%;height:auto}
.btn{box-shadow:0 3px 0 var(--line)} .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
@media (prefers-reduced-motion: reduce){ .btn:active{transform:none} }
svg .arc{transition:stroke-dasharray .5s ease}
@media (prefers-reduced-motion: reduce){ svg .arc{transition:none} }

.banner{background:var(--sun);color:#16404D;border:2px solid #16404D;border-radius:18px;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.banner .btn{background:#16404D;color:#FFFBEF;border-color:#16404D}
.note{border:2px dashed var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.list{display:flex;flex-direction:column}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-top:1.5px solid var(--line)}
.li:first-child{border-top:0}
.li .what{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.li .amt{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.total{font-weight:800;border-top:3px double var(--brass)}

.drop{border:2.5px dashed var(--brass);border-radius:22px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--panel)}
.drop.hot{background:var(--panel2)}
.steps{margin:0;padding-left:20px;text-align:left;max-width:60ch;display:flex;flex-direction:column;gap:4px}

.chart{position:relative;height:230px;display:flex;align-items:stretch;gap:0;margin-top:8px;padding-left:46px}
.chart .grid{position:absolute;left:46px;right:0;top:18px;bottom:26px;pointer-events:none}
.chart .gl{position:absolute;left:0;right:0;border-top:1.5px dashed var(--line)}
.chart .gl span{position:absolute;right:100%;margin-right:6px;transform:translateY(-50%);font-family:var(--num);font-size:12px;color:var(--muted);white-space:nowrap}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;border:0;background:transparent;padding:0;cursor:pointer;position:relative;border-radius:8px}
.col .area{flex:1;position:relative;margin-top:18px}
.col .bar{position:absolute;left:18%;right:18%;bottom:0;border-radius:7px 7px 0 0;min-height:0}
.col .bud{position:absolute;left:6%;right:6%;height:0;border-top:3px solid var(--brass)}
.col .v{position:absolute;left:0;right:0;text-align:center;font-family:var(--num);font-size:11.5px;font-weight:600;transform:translateY(-100%);padding-bottom:2px;white-space:nowrap}
.col .m{height:26px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--muted)}
.col[aria-pressed=true] .m{color:var(--bg);background:var(--ink);border-radius:999px}
.col:hover .bar{opacity:.8}
@media (max-width:560px){ .col .v{display:none} .col .m{font-size:11px} }
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:18px;vertical-align:middle;margin-right:5px}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:14px;min-width:0}
.fld input,.fld select{width:100%;font-weight:600;font-size:16px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 92px 42px;gap:8px;align-items:center;padding:4px 0}
.srow select,.srow input{width:100%;font-weight:600}
.spbox{flex-basis:100%;border:2px dashed var(--line);border-radius:16px;padding:12px 14px;margin-top:4px}
.chk{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--brass)}
#toast{display:flex;align-items:center;gap:10px}
#toast .tbtn{background:var(--bg);color:var(--ink);border:0;border-radius:999px;padding:5px 14px;font-weight:800;cursor:pointer;min-height:32px}
.brow{display:grid;grid-template-columns:14px minmax(0,1fr) 120px 42px;gap:8px;align-items:center;padding:6px 0}
.brow input{width:100%}
.x{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--panel);cursor:pointer;font-weight:800}
.err{color:var(--cherry);font-weight:700;font-size:14px}
.radio{display:flex;flex-direction:column;gap:8px;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.radio label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.radio input{width:20px;height:20px;margin-top:2px;accent-color:var(--brass)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;max-width:calc(100% - 32px);z-index:5}
#cover{position:fixed;inset:0;z-index:9;background:#FFD95A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;--ink:#16404D;--brass:#2BB5A8;--brass-hi:#9FE0D8;transition:opacity .45s ease}
#cover svg{width:min(56vw,260px);height:auto}
#cover .nm{font-family:var(--display);font-weight:700;font-size:30px;color:#16404D}
#cover.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){ #cover{transition:none} }
#tabs{display:none}
.tb{background:var(--cherry);color:var(--on-accent);border-radius:999px;padding:0 6px;font-size:11px;margin-left:4px}
@media (max-width:640px){
  #tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:3px solid var(--brass-hi);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px;z-index:4}
  #tabs button{flex:1;min-width:0;border:0;background:transparent;border-radius:14px;padding:8px 2px;font-weight:800;font-size:13px;min-height:48px;cursor:pointer;white-space:nowrap}
  #tabs button[aria-current=true]{background:var(--panel2)}
  body{padding-bottom:104px}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
</style>

<script>
/* ---------- pure logic (also run under Node for testing) ---------- */
var PALETTE=['#2BB5A8','#F2B91D','#3D8FE0','#159A8C','#C99A06','#2A5DA8','#56C2D6','#F7CF3F','#5B7BE0','#7FD1C7','#1E7FA8','#8CC4F0'];
/* Starter set: [id, name, monthly budget, regular expenses [name, amount]] */
var DEFAULT_CATS=[['groceries','Groceries',0,[]],['eating','Eating Out',0,[]],['bills','Bills and Fees',0,[]],['fun','Fun Money',0,[]],['gifts','Gifts',0,[]],['clothes','Clothes',0,[]],['toiletries','Toiletries and Supplies',0,[]],['exercise','Exercise Things',0,[]],['car','Car Fund',0,[]],['travel','Travel Fund',0,[]],['blessings','Blessings Fund',0,[]],['giving','Giving',0,[]]];
function freshSettings(){ var s={cats:[],defaults:{},overrides:{},rules:{},items:{},sampleBudgets:false,v:2};
  DEFAULT_CATS.forEach(function(c,i){ s.cats.push({id:c[0],name:c[1],color:PALETTE[i%PALETTE.length]}); s.defaults[c[0]]=c[2];
    s.items[c[0]]=c[3].map(function(it,k){return {id:c[0]+k,name:it[0],amt:it[1]}}) }); return s }
function norm(s){return String(s).toUpperCase().replace(/[^A-Z0-9]/g,'')}
function itemMatch(desc,name){var k=norm(name); return k.length>=3&&norm(desc).indexOf(k)>=0}
function round2(n){return Math.round(n*100)/100}
function parseCSV(text,delim){
  text=String(text).replace(/^﻿/,'');
  if(!delim){ var head=text.split(/\r?\n/).slice(0,6).join('\n'),sc=(head.match(/;/g)||[]).length,cm=(head.match(/,/g)||[]).length,tb=(head.match(/\t/g)||[]).length; delim=tb>sc&&tb>cm?'\t':sc>cm?';':',' }
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false } else cur+=ch }
    else if(ch==='"') q=true;
    else if(ch===delim){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur);cur=''; if(row.some(function(c){return c.trim()!==''})) rows.push(row); row=[] }
    else cur+=ch }
  row.push(cur); if(row.some(function(c){return c.trim()!==''})) rows.push(row);

function gearD(cx,cy,n,ro,rr,rot){ var d='',a=2*Math.PI/n,f=[[0,rr],[.14,ro],[.36,ro],[.5,rr]];
  for(var i=0;i<n;i++) for(var k=0;k<4;k++){var t=rot+(i+f[k][0])*a,r=f[k][1]; d+=(d?'L':'M')+(cx+r*Math.cos(t)).toFixed(2)+' '+(cy+r*Math.sin(t)).toFixed(2)}
  return d+'Z' }
function circD(cx,cy,r){return 'M'+(cx-r)+' '+cy+'a'+r+' '+r+' 0 1 0 '+(2*r)+' 0a'+r+' '+r+' 0 1 0 '+(-2*r)+' 0Z'}
